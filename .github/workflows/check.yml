name: Check Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run --prefix worker typecheck
      - name: Build bundled local telemetry
        shell: pwsh
        run: ./scripts/build-local-telemetry-sidecar.ps1
      - run: npm run check
      - run: npm run test:heading
      - run: npm run test:skin
      - run: npm run test:garage
      - run: npm run test:installer
      - run: npm run test:release-trust
      - run: npm run test:minimap-friends
      - run: npm run test:provider-defaults
      - run: npm run test:voice
      - run: npm run test:updater
      - run: npm run build
      - name: Check source safety boundary
        shell: pwsh
        run: ./scripts/check-forbidden-apis.ps1
      - name: Test Rust workspace
        working-directory: src-tauri
        run: cargo test --workspace --locked
